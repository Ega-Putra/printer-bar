# Lokalisasi via flutter gen-l10n (bukan map buatan sendiri).
# Bahasa pertama di supportedLocales (en) = fallback bila bahasa sistem
# tidak didukung; bahasa sistem yang didukung (id) dipakai otomatis.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-dir: lib/l10n
synthetic-package: false
